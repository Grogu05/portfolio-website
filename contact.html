<!doctype html>
<html lang="nl-BE" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Halid Ordu</title>

  <!-- bootstrap & icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/reset.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <!-- laeflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    section.card {
      background: rgba(25,25,25,.9);
      border-radius: 1rem;
      border: 1px solid #2b2b2b;
      box-shadow: 0 0 25px rgba(0,0,0,.5);
      padding: 2.5rem;
      width: 100%;
      max-width: 640px;
    }
    input, textarea {
      background-color: #0f0f0f !important;
      border: 1px solid #2a2a2a !important;
      color: #eee !important;
    }
    input:focus, textarea:focus {
      border-color: #6ea8ff !important;
      box-shadow: 0 0 6px #6ea8ff50 !important;
    }
    .socials a {
      color: #bbb;
      font-size: 1.5rem;
      transition: all .2s ease;
    }
    .socials a:hover { color: #6ea8ff; transform: translateY(-2px); }

    #map {
      height: 250px;
      border-radius: .75rem;
      overflow: hidden;
      margin-top: 1rem;
    }
  </style>
</head>

<body class="bg-black text-light">

  <!-- nav -->
  <header>
    <nav class="navbar navbar-expand-md border-bottom border-secondary-subtle">
      <section class="container">
        <a class="navbar-brand fw-bold" href="index.html">Halid Ordu</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <section id="nav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#about">Over mij</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Projecten</a></li>
            <li class="nav-item"><a class="btn btn-primary ms-md-2" href="contact.html">Contact</a></li>
          </ul>
        </section>
      </section>
    </nav>
  </header>

  <!-- contact kaart -->
  <main>
    <section class="card">
      <header class="mb-4 text-center">
        <h1 class="fw-bold">Contact</h1>
        <p class="text-secondary mb-0">
          Wil je samenwerken of heb je een vraag? Stuur gerust een bericht .
        </p>
      </header>

      <form name="contact" method="POST" data-netlify="true" action="/contact.html">
        <input type="hidden" name="form-name" value="contact">
        <fieldset class="mb-3">
          <label for="naam" class="form-label">Naam</label>
          <input type="text" id="naam" name="naam" class="form-control" placeholder="Je naam" required>
        </fieldset>

        <fieldset class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="email@example.com" required>
        </fieldset>

        <fieldset class="mb-4">
          <label for="bericht" class="form-label">Bericht</label>
          <textarea id="bericht" name="bericht" class="form-control" rows="5" placeholder="Je bericht..." required></textarea>
        </fieldset>

        <section class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-send me-1"></i> Verstuur bericht
          </button>

          <p class="small mb-0 text-secondary">
            Of mail rechtstreeks naar <a href="mailto:orduhalid@gmail.com" class="link-light fw-semibold">orduhalid@gmail.com</a>
          </p>
        </section>
      </form>

      <section class="mt-4">
        <h2 class="h5 mb-2">Kaart</h2>
        <div id="map"></div>
      </section>

      <hr class="my-4 border-secondary">

      <footer class="text-center">
        <p class="mb-1 text-secondary">Telefoon: <span class="text-light fw-semibold">+32 483 24 94 18</span></p>
        <p class="mb-3 text-secondary">Volg mij op</p>
        <section class="socials d-flex justify-content-center gap-4">
          <a href="https://www.linkedin.com/in/ordu-halid-a40811391/?skipRedirect=true" target="_blank" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="https://github.com/Grogu05" target="_blank" aria-label="GitHub"><i class="bi bi-github"></i></a>
          <a href="mailto:orduhalid@gmail.com" aria-label="E-mail"><i class="bi bi-envelope-fill"></i></a>
        </section>
      </footer>
    </section>
  </main>

  <footer class="border-top border-secondary-subtle py-4 mt-5">
    <section class="container small text-center text-secondary">
      © <span id="y"></span> Halid Ordu
    </section>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
